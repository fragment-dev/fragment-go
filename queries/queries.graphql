query ListLedgerEntryGroupBalances(
  $ledgerIk: SafeString!
  $groupKey: SafeString!
  $groupValue: SafeString!
  $consistencyMode: ReadBalanceConsistencyMode = use_account
  $after: String
  $before: String
  $first: Int
  $last: Int
  $filter: LedgerEntryGroupBalanceFilterSet
) {
  ledgerEntryGroup(
    ledgerEntryGroup: {
      ledger: { ik: $ledgerIk }
      key: $groupKey
      value: $groupValue
    }
  ) {
    key
    value
    created
    balances(
      after: $after
      before: $before
      first: $first
      last: $last
      filter: $filter
    ) {
      nodes {
        account {
          path
        }
        currency {
          code
          customCurrencyId
        }
        ownBalance(consistencyMode: $consistencyMode)
      }
      pageInfo {
        hasNextPage
        endCursor
        hasPreviousPage
        startCursor
      }
    }
  }
}

query GetEntryDataMigrations(
  $ledgerIk: SafeString!
  $filter: LedgerEntryDataMigrationsFilterSet
  $after: String
  $before: String
  $first: Int
  $last: Int
) {
  ledger(ledger: { ik: $ledgerIk }) {
    ledgerEntryDataMigrations(
      first: $first
      after: $after
      before: $before
      last: $last
      filter: $filter
    ) {
      nodes {
        entryType
        typeVersion
        status
        currentMigration {
          schemaVersion
          status
        }
        ledgerEntries {
          nodes {
            id
            type
            posted
            parameters
          }
          pageInfo {
            hasNextPage
            endCursor
            hasPreviousPage
            startCursor
          }
        }
        history {
          nodes {
            schemaVersion
            status
          }
          pageInfo {
            hasNextPage
            endCursor
            hasPreviousPage
            startCursor
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
        hasPreviousPage
        startCursor
      }
    }
  }
}

