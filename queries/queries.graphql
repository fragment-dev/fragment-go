mutation AddLedgerEntry(
  $ik: SafeString!
  $ledgerIk: SafeString!
  $entryType: String!
  $typeVersion: Int
  $posted: DateTime
  $parameters: JSON!
  $tags: [LedgerEntryTagInput!]
  $groups: [LedgerEntryGroupInput!]
) {
  addLedgerEntry(
    ik: $ik
    entry: {
      ledger: { ik: $ledgerIk }
      type: $entryType
      typeVersion: $typeVersion
      posted: $posted
      parameters: $parameters
      tags: $tags
      groups: $groups
    }
  ) {
    __typename
    ... on AddLedgerEntryResult {
      isIkReplay
      entry {
        type
        id
        ik
        posted
        created
      }
      lines {
        id
        amount
        account {
          path
        }
      }
    }
    ... on BadRequestError {
      code
      message
      retryable
    }
    ... on InternalError {
      code
      message
      retryable
    }
  }
}

mutation ReverseLedgerEntry($id: ID!) {
  reverseLedgerEntry(id: $id) {
    __typename
    ... on ReverseLedgerEntryResult {
      reversingLedgerEntry {
        ik
        id
        created
        posted
        type
        description
        hidden
        lines {
          nodes {
            id
            amount
            account {
              path
            }
          }
        }
      }
      reversedLedgerEntry {
        ik
        id
        created
        posted
        type
        description
        hidden
        lines {
          nodes {
            id
            amount
            account {
              path
            }
          }
        }
      }
      isIkReplay
    }
    ... on BadRequestError {
      code
      message
      retryable
    }
    ... on InternalError {
      code
      message
      retryable
    }
  }
}

mutation MigrateLedgerEntry($id: ID!, $newLedgerEntry: LedgerEntryInput!) {
  migrateLedgerEntry(input: { id: $id, newLedgerEntry: $newLedgerEntry }) {
    __typename
    ... on MigrateLedgerEntryResult {
      reversingLedgerEntry {
        ik
        id
        created
        posted
        type
        description
        reversedAt
        hidden
        lines {
          nodes {
            id
            amount
            account {
              path
            }
          }
        }
      }
      reversedLedgerEntry {
        ik
        id
        created
        posted
        type
        description
        reversedAt
        hidden
        lines {
          nodes {
            id
            amount
            account {
              path
            }
          }
        }
      }
      newLedgerEntry {
        ik
        id
        created
        posted
        type
        description
        reversedAt
        hidden
        lines {
          nodes {
            id
            amount
            account {
              path
            }
          }
        }
      }
      isIkReplay
    }
    ... on BadRequestError {
      code
      message
      retryable
    }
    ... on InternalError {
      code
      message
      retryable
    }
  }
}

