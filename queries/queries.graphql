mutation CreateCustomCurrency(
  $id: SafeString!
  $name: String!
  $precision: Int!
  $customCode: String!
) {
  createCustomCurrency(
    customCurrency: {
      customCurrencyId: $id
      name: $name
      precision: $precision
      customCode: $customCode
    }
  ) {
    ... on CreateCustomCurrencyResult {
      customCurrency {
        code
        customCurrencyId
        precision
        name
        customCode
      }
    }
    ... on BadRequestError {
      code
      message
      retryable
    }
    ... on InternalError {
      code
      message
      retryable
    }
  }
}
