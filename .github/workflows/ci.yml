name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22', '1.23']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go }}
        id: go

      # No FRAGMENT_* credentials here on purpose: internal/livetest skips itself
      # without them, so this job stays offline and runs once per Go version. The
      # live job below runs those tests once, against a real API.
      - name: Run tests
        run: |
          go test -cover -v ./...

      - name: Validate GraphQL queries
        run: |
          export EXITCODE=$(grep -E '^(mutation|query) [a-z]' queries/queries.graphql || echo $?)
          if [[ $EXITCODE -eq 0 ]]; then
            echo "Failed to validate queries."
            echo "Ensure that queries are in TitleCase."
            exit 1
          fi

      - name: Verify generated queries are up-to-date
        run: |
          go run main.go \
            --input=queries/queries.graphql \
            --output=queries/queries.go \
            --package=queries
          git diff --exit-code
          exit $?

  live:
    name: Live API tests
    runs-on: ubuntu-latest
    # Once, not per Go version: each run stores a Schema version and creates a
    # Ledger in a real Workspace, and the tests exercise the API rather than
    # anything version-specific.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Run live API tests
        run: |
          go test -v ./internal/livetest/
        env:
          FRAGMENT_CLIENT_ID: ${{ secrets.FRAGMENT_CLIENT_ID }}
          FRAGMENT_CLIENT_SECRET: ${{ secrets.FRAGMENT_CLIENT_SECRET }}
          FRAGMENT_SCOPE: ${{ secrets.FRAGMENT_SCOPE }}
          FRAGMENT_AUTH_URL: ${{ secrets.FRAGMENT_AUTH_URL }}
          FRAGMENT_API_URL: ${{ secrets.FRAGMENT_API_URL }}

      # Skipping is the correct outcome on a fork pull request, where secrets are
      # unavailable, but it should not look like the tests passed. This fails the
      # job when a run that *should* have credentials silently skipped instead —
      # a deleted or renamed secret would otherwise go unnoticed.
      - name: Fail if the live tests skipped on a branch that has secrets
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "${FRAGMENT_CLIENT_ID}" ]; then
            echo "This pull request is from this repository, so the FRAGMENT_* secrets"
            echo "should be set, but FRAGMENT_CLIENT_ID is empty."
            echo
            echo "Set them with:"
            echo "  gh secret set FRAGMENT_CLIENT_ID --repo ${{ github.repository }}"
            echo "  gh secret set FRAGMENT_CLIENT_SECRET --repo ${{ github.repository }}"
            echo "  gh secret set FRAGMENT_SCOPE --repo ${{ github.repository }}"
            echo "  gh secret set FRAGMENT_AUTH_URL --repo ${{ github.repository }}"
            echo "  gh secret set FRAGMENT_API_URL --repo ${{ github.repository }}"
            echo
            echo "Point them at a scratch Workspace: every run creates a Ledger."
            exit 1
          fi
        env:
          FRAGMENT_CLIENT_ID: ${{ secrets.FRAGMENT_CLIENT_ID }}
